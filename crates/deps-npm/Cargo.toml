[package]
name = "deps-npm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "npm/package.json support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Exposes `NpmRegistry::with_public_base_for_test` to other workspace crates' own test builds
# (M7/#312) — `cfg(test)` alone would not apply there, since deps-npm is a normal, non-dev
# dependency of e.g. deps-deno. Mirrors deps-core's own `test-util` feature (see its
# Cargo.toml). Only ever enabled from a `[dev-dependencies]` entry, so Cargo's feature
# unification keeps it out of non-test builds of downstream crates.
#
# SECURITY: also gates `NpmRegistryIndex::new`'s `http`-loopback carve-out (spec FR-006/
# NFR-002) — the only shape a plain `http://` registry index is ever accepted, and only for
# `127.0.0.1`/`localhost`/`::1`. The carve-out itself now lives in `deps-core`, so this
# forwards `deps-core/test-util`. `deps-deno` (a `publish = true` crate) enables this feature
# from its own `[dev-dependencies]`, same as every other consumer — never from a non-dev
# dependency, or a release build of that crate would compile in the http carve-out too.
test-util = ["deps-core/test-util"]

# Exposes `lockfile::fuzz_parse_pnpm_lock_yaml` and `catalog::fuzz_parse_pnpm_workspace` for
# the `fuzz/` cargo-fuzz workspace's `pnpm_lockfile`/`pnpm_catalog` targets (#727) — mirrors
# `deps-gradle`/`deps-maven`'s own `fuzzing` feature (see their Cargo.toml comments). Never
# enabled by this crate's own default feature set, so these wrappers stay out of the normal
# public API surface.
fuzzing = []

# Gates this crate's own `tower-lsp-server` dependency and LSP-response-shaped code
# (including its `generate_hover`/`generate_code_actions`/`generate_code_lenses`
# overrides), forwarding to `deps-core`'s identically-named feature (issue #1083, spec
# 064). Not `default`: Cargo does not allow a `workspace = true` dependency edge to turn
# off a default feature, so making this default here would make it inescapable for
# `deps-engine` (see its own `lsp-responses` feature doc). `deps-lsp` requests it
# explicitly, directly or via `deps-engine`'s own `lsp-responses`; `deps-cli` never does,
# keeping `tower-lsp-server` out of its dependency tree.
lsp-responses = ["dep:tower-lsp-server", "deps-core/lsp-responses"]

[dependencies]
dashmap = { workspace = true }
deps-core = { workspace = true }
dirs = { workspace = true }
node-semver = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-lsp-server = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
yaml-rust2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
deps-core = { workspace = true, features = ["test-util"] }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "npm_benchmarks"
harness = false
