[package]
name = "deps-npm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "npm/package.json support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Exposes `NpmRegistry::with_registry_base` to other workspace crates' own test builds
# (M7/#312) — `cfg(test)` alone would not apply there, since deps-npm is a normal, non-dev
# dependency of e.g. deps-deno. Mirrors deps-core's own `test-util` feature (see its
# Cargo.toml). Only ever enabled from a `[dev-dependencies]` entry, so Cargo's feature
# unification keeps it out of non-test builds of downstream crates.
test-util = []

[dependencies]
dashmap = { workspace = true }
deps-core = { workspace = true }
node-semver = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
deps-core = { workspace = true, features = ["test-util"] }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = { workspace = true }

[[bench]]
name = "npm_benchmarks"
harness = false
