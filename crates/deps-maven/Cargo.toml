[package]
name = "deps-maven"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "pom.xml support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Exposes `registry::fuzz_parse_metadata_xml` for the `fuzz/` cargo-fuzz workspace's
# `registry_xml_parser` target (#691) — never enabled by this crate's own default feature
# set, so `parse_metadata_xml` stays out of the normal public API surface.
fuzzing = []

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
deps-core = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
deps-core = { workspace = true, features = ["test-util"] }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = { workspace = true }
url = { workspace = true }
