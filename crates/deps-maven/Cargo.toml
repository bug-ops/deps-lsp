[package]
name = "deps-maven"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "pom.xml support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Exposes `registry::fuzz_parse_metadata_xml` for the `fuzz/` cargo-fuzz workspace's
# `registry_xml_parser` target (#691) — never enabled by this crate's own default feature
# set, so `parse_metadata_xml` stays out of the normal public API surface.
fuzzing = []

# Gates this crate's own `tower-lsp-server` dependency and LSP-response-shaped code,
# forwarding to `deps-core`'s identically-named feature (issue #1083, spec 064). Not
# `default`: Cargo does not allow a `workspace = true` dependency edge to turn off a
# default feature, so making this default here would make it inescapable for `deps-engine`
# (see its own `lsp-responses` feature doc). `deps-lsp` requests it explicitly, directly or
# via `deps-engine`'s own `lsp-responses`; `deps-cli` never does, keeping `tower-lsp-server`
# out of its dependency tree.
lsp-responses = ["dep:tower-lsp-server", "deps-core/lsp-responses"]

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
deps-core = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
tower-lsp-server = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
deps-core = { workspace = true, features = ["test-util"] }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = { workspace = true }
url = { workspace = true }
