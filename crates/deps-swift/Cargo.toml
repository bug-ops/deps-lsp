[package]
name = "deps-swift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Swift Package Manager support for deps-lsp"

[lints]
workspace = true

[features]
# Exposes `lockfile::fuzz_parse_package_resolved` for the `fuzz/` cargo-fuzz workspace's
# `json_lockfiles` target (#1404) — never enabled by this crate's own default feature set,
# so `parse_package_resolved` stays out of the normal public API surface. Mirrors
# `deps-gradle`/`deps-npm`'s identical `fuzzing` feature.
fuzzing = []

# Gates this crate's own `tower-lsp-server` dependency and LSP-response-shaped code,
# forwarding to `deps-core`'s identically-named feature (issue #1083, spec 064). Not
# `default`: Cargo does not allow a `workspace = true` dependency edge to turn off a
# default feature, so making this default here would make it inescapable for `deps-engine`
# (see its own `lsp-responses` feature doc). `deps-lsp` requests it explicitly, directly or
# via `deps-engine`'s own `lsp-responses`; `deps-cli` never does, keeping `tower-lsp-server`
# out of its dependency tree.
lsp-responses = ["dep:tower-lsp-server", "deps-core/lsp-responses"]

[dependencies]
deps-core = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
tower-lsp-server = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
deps-core = { workspace = true, features = ["test-util"] }
mockito = { workspace = true }
tempfile = { workspace = true }
