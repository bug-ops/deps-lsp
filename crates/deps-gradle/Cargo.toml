[package]
name = "deps-gradle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Gradle build system support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Exposes `license::fuzz_parse_pom_licenses` (and makes the otherwise-private `license`
# module `pub`) for the `fuzz/` cargo-fuzz workspace's `registry_xml_parser` target
# (#691) — never enabled by this crate's own default feature set, so `parse_pom_licenses`
# stays out of the normal public API surface.
fuzzing = []

[dependencies]
deps-core = { workspace = true }
deps-maven = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
toml-span = { workspace = true }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
deps-core = { workspace = true, features = ["test-util"] }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = { workspace = true }
