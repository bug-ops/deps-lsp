[package]
name = "deps-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core abstractions for deps-lsp: caching, errors, and traits"
publish = true

[lints]
workspace = true

[features]
# Exposes `test_util` to other workspace crates' own test builds, where
# `cfg(test)` alone would not apply (deps-core is a normal, non-dev
# dependency there).
#
# Security note: enabling this feature also relaxes `cache::ensure_https`
# to allow plain HTTP for loopback hosts (`127.0.0.1`/`localhost`/`::1`),
# needed for cross-crate `mockito` tests. This feature is publicly
# enablable by any downstream Cargo.toml (this crate has `publish = true`),
# so it must never be enabled in a shipped/release build — see
# `cache::ensure_https` for the full contract.
test-util = ["dep:url", "dep:urlencoding"]

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "gzip"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["std", "parsing"] }
tokio = { workspace = true, features = ["sync", "time", "fs"] }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
yaml-rust2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false
