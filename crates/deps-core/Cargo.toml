[package]
name = "deps-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core abstractions for deps-lsp: caching, errors, and traits"
publish = true

[lints]
workspace = true

[features]
# Gates `hover.rs`/`code_actions.rs`/`code_lenses.rs`/`inlay_hints.rs`/`generate_document_links`
# and their `Ecosystem` trait default methods, plus the `tower-lsp-server` dependency itself
# (issue #1083, spec 064) — the only remaining `lsp_helpers` surface that still constructs real
# `tower_lsp_server::ls_types` response objects directly (diagnostics no longer need this
# feature after #1083's domain `diagnostic::Diagnostic` type).
#
# Deliberately **not** in `default`: Cargo does not allow a `workspace = true` dependency
# edge to override the workspace's `default-features` value (there is none declared for
# `deps-core` in root `[workspace.dependencies]`, so it would default to `true` for every
# consumer, and no member could opt back out — the exact problem `deps-engine`'s own
# per-ecosystem `dep:`-optional features hit in #1058). Making this feature non-default and
# having every consumer that wants it explicitly request `deps-core/lsp-responses` (either
# directly, as `deps-lsp` does, or transitively through its own same-named feature, as every
# ecosystem crate and `deps-engine` do) is the only shape that lets `deps-cli` opt out while
# `deps-lsp` opts in — `features = [...]` can always be *added* to a workspace-inherited
# dependency edge, only `default-features` cannot be turned off.
lsp-responses = ["dep:tower-lsp-server"]
# Exposes `test_util` to other workspace crates' own test builds, where
# `cfg(test)` alone would not apply (deps-core is a normal, non-dev
# dependency there).
#
# Security note: enabling this feature also relaxes `cache::ensure_https`
# to allow plain HTTP for loopback hosts (`127.0.0.1`/`localhost`/`::1`),
# needed for cross-crate `mockito` tests. It also relaxes
# `net_policy::validate_index_url`'s identical https-only gate the same way —
# the shared chokepoint `deps-cargo`/`deps-npm`/`deps-pypi` all validate their
# registry/index URLs through. It also exposes `fs_probe::snapshot()`, the
# stat/read call counters `MtimeFileCache` consumers assert against in their
# own tests. Also exposes `conformance`'s macro-generated fixtures (#758), which
# need `tempfile` as a non-dev dependency for the same reason `test_util` needs
# `tracing-subscriber` as one: a downstream crate's own `#[cfg(test)]` build sees
# deps-core only through its regular (non-dev) dependency edge. This feature is
# publicly enablable by any downstream Cargo.toml (this crate has `publish =
# true`), so it must never be enabled in a shipped/release build — see
# `cache::ensure_https` and `net_policy::validate_index_url` for the full contract.
test-util = ["dep:tracing-subscriber", "dep:tempfile"]

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
jsonc-parser = { workspace = true }
reqwest = { workspace = true, features = ["json", "gzip"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["std", "parsing"] }
tokio = { workspace = true, features = ["sync", "time", "fs", "net"] }
tower-lsp-server = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
unicode-general-category = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
yaml-rust2 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
insta = { workspace = true }
mockito = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false
required-features = ["test-util"]
