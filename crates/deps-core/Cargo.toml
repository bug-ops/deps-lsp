[package]
name = "deps-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core abstractions for deps-lsp: caching, errors, and traits"
publish = true

[lints]
workspace = true

[features]
# Exposes `test_util` to other workspace crates' own test builds, where
# `cfg(test)` alone would not apply (deps-core is a normal, non-dev
# dependency there).
test-util = []

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "gzip"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "fs"] }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }
yaml-rust2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-test = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false
