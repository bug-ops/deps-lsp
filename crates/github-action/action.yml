name: deps-lsp check
description: >-
  Runs deps-cli check --format sarif and writes the result to a SARIF file.
  Does not upload it to GitHub code scanning — wire
  github/codeql-action/upload-sarif after this action in your own workflow
  (FR-018).
inputs:
  paths:
    description: Space-separated paths to walk. Defaults to deps-cli's own default (the repository root).
    required: false
    default: ''
  fail-on:
    description: Comma-separated categories that make the run exit 1 (see `deps-cli check --help`).
    required: false
    default: ''
  cooldown:
    description: Overrides freshness.cooldown_secs for this run (e.g. `3d`).
    required: false
    default: ''
  config:
    description: >-
      Path to a fully-trusted deps.toml config file. Must point outside the
      scanned checkout and be controlled by the workflow operator, not the
      scanned repository — an explicit --config is trusted in full (unlike
      an auto-discovered deps.toml, which has its registries/network/
      diagnostics.*_enabled sections reset to safe defaults), so passing a
      path from inside the checked-out repository re-opens the credential-
      exfiltration risk that hardening exists to prevent, particularly for
      pull_request_target workflows scanning a fork.
    required: false
    default: ''
outputs:
  sarif-file:
    description: >-
      Path to the produced SARIF file. Set only when a non-empty regular
      SARIF file was produced by the run — it may be unset even when
      exit-code is 0 (clean) or 1 (a --fail-on category matched), e.g. when
      the output path could not be written or the file came out empty. Also
      unset for any other exit code (execution error, e.g. a deps-cli panic
      or missing binary), since the file may be missing, truncated, or
      unsafe to trust and should not be fed to upload-sarif.
  exit-code:
    description: >-
      deps-cli check's own exit code (0 clean, 1 a --fail-on category
      matched, 2 execution error) when the run completed; the step also
      reports the raw exit code here for an abnormal deps-cli termination
      (e.g. a panic). Set whenever deps-cli ran, even if it produced no
      usable SARIF file; unset only if the action refused to start before
      running deps-cli at all (e.g. a directory pre-placed at the SARIF
      output path). Check this output — not the step's own pass/fail — to
      react to a policy violation; the step itself fails the job on any
      exit code other than 0 or 1.
runs:
  using: docker
  image: docker://ghcr.io/bug-ops/deps-lsp-github-action@sha256:4361896940340be0daaf44c1db14ff0a45a094c830809c3fca8e0c7adae3973d
  env:
    DEPS_CLI_PATHS: ${{ inputs.paths }}
    DEPS_CLI_FAIL_ON: ${{ inputs.fail-on }}
    DEPS_CLI_COOLDOWN: ${{ inputs.cooldown }}
    DEPS_CLI_CONFIG: ${{ inputs.config }}
