[package]
name = "deps-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Language Server Protocol implementation for dependency management"
publish = true

[lints]
workspace = true

[[bin]]
name = "deps-lsp"
path = "src/main.rs"

[lib]
name = "deps_lsp"
path = "src/lib.rs"

[features]
default = ["cargo", "npm", "pypi", "go", "bundler", "dart", "maven", "gradle", "swift", "composer", "nuget", "deno", "github-actions", "gitlab-ci"]
cargo = ["deps-engine/cargo"]
npm = ["deps-engine/npm"]
pypi = ["deps-engine/pypi"]
go = ["deps-engine/go"]
bundler = ["deps-engine/bundler"]
dart = ["deps-engine/dart"]
maven = ["deps-engine/maven"]
gradle = ["deps-engine/gradle"]
swift = ["deps-engine/swift"]
composer = ["deps-engine/composer"]
nuget = ["deps-engine/nuget"]
github-actions = ["deps-engine/github-actions"]
gitlab-ci = ["deps-engine/gitlab-ci"]
# Pulls in deps-npm transitively (DenoRegistry delegates npm: specifiers to it, D3) even
# when the "npm" feature itself is disabled.
deno = ["deps-engine/deno"]

[dependencies]
# Internal crates
deps-core = { workspace = true }
deps-engine = { workspace = true }

# External dependencies
dashmap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "io-std"] }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
deps-core = { workspace = true, features = ["test-util"] }
deps-deno = { workspace = true }
deps-github-actions = { workspace = true }
deps-gitlab-ci = { workspace = true }
deps-npm = { workspace = true }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }

[[bench]]
name = "lsp_handlers"
harness = false
