[package]
name = "deps-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Language Server Protocol implementation for dependency management"
publish = true

[lints]
workspace = true

[[bin]]
name = "deps-lsp"
path = "src/main.rs"

[lib]
name = "deps_lsp"
path = "src/lib.rs"

[features]
default = ["cargo", "npm", "pypi", "go", "bundler", "dart", "maven", "gradle", "swift", "composer", "nuget", "deno", "github-actions", "gitlab-ci"]
cargo = ["deps-engine/cargo"]
npm = ["deps-engine/npm"]
pypi = ["deps-engine/pypi"]
go = ["deps-engine/go"]
bundler = ["deps-engine/bundler"]
dart = ["deps-engine/dart"]
maven = ["deps-engine/maven"]
gradle = ["deps-engine/gradle"]
swift = ["deps-engine/swift"]
composer = ["deps-engine/composer"]
nuget = ["deps-engine/nuget"]
github-actions = ["deps-engine/github-actions"]
gitlab-ci = ["deps-engine/gitlab-ci"]
# Pulls in deps-npm transitively (DenoRegistry delegates npm: specifiers to it, D3) even
# when the "npm" feature itself is disabled.
deno = ["deps-engine/deno"]

[dependencies]
# Internal crates
#
# Both request `lsp-responses` unconditionally (issue #1083, spec 064): `deps-lsp` is the
# actual protocol server, so it always needs `deps-core`'s and every enabled ecosystem
# crate's LSP-response-shaped surface — unlike `deps-cli`, which never enables it.
deps-core = { workspace = true, features = ["lsp-responses"] }
deps-engine = { workspace = true, features = ["lsp-responses"] }

# External dependencies
dashmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "io-std"] }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
deps-core = { workspace = true, features = ["test-util"] }
# `features = ["lsp-responses"]` explicit on each (issue #1083): these are unconditional dev
# dependencies, compiled for every `cargo-hack --each-feature` slice of this crate regardless
# of which ecosystem feature is toggled on `deps-lsp` itself, so `deps-engine`'s own
# `lsp-responses` weak-dependency forwarding (which only fires for an ecosystem `deps-engine`
# itself optionally enabled) never reaches them.
deps-deno = { workspace = true, features = ["lsp-responses"] }
deps-github-actions = { workspace = true, features = ["lsp-responses"] }
deps-gitlab-ci = { workspace = true, features = ["lsp-responses"] }
deps-npm = { workspace = true, features = ["lsp-responses"] }
futures = { workspace = true }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
# `test-util` is what `#[tokio::test(start_paused = true)]` needs (`Builder::start_paused`);
# previously reached transitively through the now-removed `tokio-test` dev-dependency, which
# had no other, directly-used API in this crate — made explicit here instead.
tokio = { workspace = true, features = ["test-util"] }
# `util` is what `ServiceExt::ready` needs, to drive a real `initialize` handshake
# through `LspService`'s `tower::Service<Request>` impl and unblock `Client::apply_edit`
# (gated on `State::Initialized`) — see #1335.
tower = { workspace = true, features = ["util"] }

[[bench]]
name = "lsp_handlers"
harness = false
