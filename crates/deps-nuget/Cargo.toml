[package]
name = "deps-nuget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NuGet/.NET project file support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Exposes `parse_flat_container_for_bench` to this crate's own `benches/` target — a
# `[[bench]]` target compiles the lib as an ordinary, non-test dependency, so plain
# `#[cfg(test)]` alone does not apply there. Mirrors `deps-core`'s own `test-util` feature
# and `HttpCache::get_for_bench` (#835 M1). Never enabled outside a benchmark build.
test-util = []

# Gates this crate's own `tower-lsp-server` dependency and LSP-response-shaped code,
# forwarding to `deps-core`'s identically-named feature (issue #1083, spec 064). Not
# `default`: Cargo does not allow a `workspace = true` dependency edge to turn off a
# default feature, so making this default here would make it inescapable for `deps-engine`
# (see its own `lsp-responses` feature doc). `deps-lsp` requests it explicitly, directly or
# via `deps-engine`'s own `lsp-responses`; `deps-cli` never does, keeping `tower-lsp-server`
# out of its dependency tree.
lsp-responses = ["dep:tower-lsp-server", "deps-core/lsp-responses"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
deps-core = { workspace = true }
dirs = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "sync"] }
tower-lsp-server = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
deps-core = { workspace = true, features = ["test-util"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "nuget_benchmarks"
harness = false
required-features = ["test-util"]
