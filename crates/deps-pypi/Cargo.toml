[package]
name = "deps-pypi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyPI/Python support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Gates the test-only https loopback carve-out in `config::PypiIndexUrl::new` for
# downstream crates' own test builds (`cfg(test)` alone would not apply there) —
# mirrors `deps-npm`'s identical `test-util` feature. The carve-out itself now lives in
# `deps-core`, so this forwards `deps-core/test-util`.
test-util = ["deps-core/test-util"]

[dependencies]
dashmap = { workspace = true }
deps-core = { workspace = true }
pep440_rs = { workspace = true }
pep508_rs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml-span = { workspace = true }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
deps-core = { workspace = true, features = ["test-util"] }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "pypi_benchmarks"
harness = false
