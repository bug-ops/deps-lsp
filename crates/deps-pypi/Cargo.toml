[package]
name = "deps-pypi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyPI/Python support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Gates the test-only https loopback carve-out in `config::PypiIndexUrl::new` for
# downstream crates' own test builds (`cfg(test)` alone would not apply there) —
# mirrors `deps-npm`'s identical `test-util` feature. The carve-out itself now lives in
# `deps-core`, so this forwards `deps-core/test-util`.
test-util = ["deps-core/test-util"]

# Gates this crate's own `tower-lsp-server` dependency and LSP-response-shaped code,
# forwarding to `deps-core`'s identically-named feature (issue #1083, spec 064). Not
# `default`: Cargo does not allow a `workspace = true` dependency edge to turn off a
# default feature, so making this default here would make it inescapable for `deps-engine`
# (see its own `lsp-responses` feature doc). `deps-lsp` requests it explicitly, directly or
# via `deps-engine`'s own `lsp-responses`; `deps-cli` never does, keeping `tower-lsp-server`
# out of its dependency tree.
lsp-responses = ["dep:tower-lsp-server", "deps-core/lsp-responses"]

[dependencies]
dashmap = { workspace = true }
deps-core = { workspace = true }
pep440_rs = { workspace = true }
pep508_rs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
toml-span = { workspace = true }
tower-lsp-server = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
deps-core = { workspace = true, features = ["test-util"] }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "pypi_benchmarks"
harness = false
