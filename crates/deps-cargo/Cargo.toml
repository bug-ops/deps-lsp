[package]
name = "deps-cargo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo.toml support for deps-lsp"
publish = true

[lints]
workspace = true

[features]
# Relaxes `RegistryIndex::new`'s https-only gate for a loopback host, so a test (unit or
# integration) can point it at a `mockito::Server` without weakening the gate for real
# builds — mirrors `deps-core`'s own `test-util` feature and `HttpCache::ensure_https`'s
# identical precedent.
#
# Security note: this feature is publicly enablable by any downstream Cargo.toml (this
# crate has `publish = true`), so it must never be enabled in a shipped/release build — see
# `config::RegistryIndex::new`'s loopback carve-out for the full contract. Forwards
# `deps-core`'s own `test-util`, since the loopback carve-out itself now lives there.
test-util = ["deps-core/test-util"]

# Gates this crate's own `tower-lsp-server` dependency and LSP-response-shaped code,
# forwarding to `deps-core`'s identically-named feature (issue #1083, spec 064). Not
# `default`: Cargo does not allow a `workspace = true` dependency edge to turn off a
# default feature, so making this default here would make it inescapable for `deps-engine`
# (see its own `lsp-responses` feature doc). `deps-lsp` requests it explicitly, directly or
# via `deps-engine`'s own `lsp-responses`; `deps-cli` never does, keeping `tower-lsp-server`
# out of its dependency tree.
lsp-responses = ["dep:tower-lsp-server", "deps-core/lsp-responses"]

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
deps-core = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
toml-span = { workspace = true }
tower-lsp-server = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
deps-cargo = { path = ".", features = ["test-util"] }
deps-core = { workspace = true, features = ["test-util"] }
insta = { workspace = true, features = ["json"] }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = { workspace = true }

[[bench]]
name = "cargo_benchmarks"
harness = false
