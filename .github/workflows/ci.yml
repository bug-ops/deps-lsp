name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly dependency check

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/Cross.toml'
            workflows:
              - '.github/workflows/**'
              - '!.github/workflows/mdbook.yml'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: nightly
          components: rustfmt
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          components: clippy
          cache-extra-identifier: clippy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fuzz-check:
    name: Fuzz Workspace Check
    needs: changes
    # `fuzz/` is a separate cargo workspace (excluded from the root workspace, see root
    # `Cargo.toml`'s `exclude`), so `cargo check --workspace` at the repo root never type-checks
    # it. #1088: PR #1087 changed several `Ecosystem`/`parse_*` signatures across ecosystem
    # crates and silently broke ten fuzz harnesses, caught only by the slow, non-blocking `fuzz`
    # job below. This fast, blocking check catches that class of break immediately.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz-check

      - name: Check fuzz workspace
        working-directory: fuzz
        run: cargo check --workspace

  feature-matrix:
    name: Feature Matrix Check
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          components: clippy
          cache-extra-identifier: feature-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-hack

      - name: Check each feature individually
        # `clippy` above only lints --all-features, which hides lints that only surface
        # under a reduced feature set (issue #975) — `--each-feature` is linear in feature
        # count (41 invocations here), not the 2^n a full --feature-powerset would cost.
        # `cargo hack clippy` (not `check`) so this catches the same clippy-level lints as
        # the `clippy` job, just per individual feature. `--no-dev-deps` keeps this
        # workspace-wide sweep (15 crates) fast by skipping test-target compilation; deps-lsp
        # is the one crate that needs its own dev-deps/test-target coverage per feature, so it
        # gets a dedicated `--all-targets` step below instead of paying that cost here for
        # every crate. `--keep-going` reports every failing slice in one run, not just the first.
        run: cargo hack clippy --workspace --each-feature --no-dev-deps --keep-going -- -D warnings

      - name: Check deps-lsp test compilation and lints across the feature matrix
        # deps-lsp (issue #998, following #975's fix for lib/bin targets): its
        # `#[cfg(test)]` module and test helpers must also compile, and lint clean, under
        # every reduced feature set, not just under --all-features (#1001 fixed the
        # remaining unused-import/dead-code warnings so this can run at the same
        # `-D warnings` strictness as the workspace-wide `clippy` job above).
        run: cargo hack clippy -p deps-lsp --each-feature --all-targets --keep-going -- -D warnings

      - name: Check deps-engine test compilation and lints across the feature matrix
        # deps-engine (issue #1059): the classification-layer extraction moved ~2000 lines
        # of feature-gated test code out of deps-lsp (already covered by the step above) into
        # this crate, which had no equivalent per-feature coverage — the workspace-wide
        # `--no-dev-deps` sweep above skips test-target compilation entirely, so a
        # feature-gated `#[cfg(feature = "...")]` import/module dropped or mis-scoped during a
        # future move would compile clean under --all-features and still slip through review
        # (exactly how a dropped `#[cfg(feature = "pypi")]` on deps-lsp's own `mod pypi_tests`
        # was first caught for this crate's sibling). Mirrors the deps-lsp step immediately
        # above at the same `-D warnings` strictness.
        run: cargo hack clippy -p deps-engine --each-feature --all-targets --keep-going -- -D warnings

  feature-matrix-test:
    name: Feature Matrix Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # issue #1030: `--each-feature` used to run all 17 slices (14 ecosystem features,
        # `default`, --all-features, --no-default-features) serially on one runner (~10m47s
        # measured), making this the pipeline's critical path once #1018 split it out on its
        # own. `default` is dropped entirely: `[features] default = [...all 14 ecosystems...]`
        # in crates/deps-lsp/Cargo.toml activates the exact same feature set as --all-features
        # (verified: a --all-features build followed by --no-default-features --features
        # default recompiles nothing — a pure cache-hit), so it was a fully redundant re-run of
        # the same 571 tests with zero new coverage. The remaining 16 slices are split across 4
        # matrix legs (measured per-slice timing: ~51s all-features, ~39s no-default-features,
        # ~24-36s per ecosystem feature) so the slowest leg finishes in a few minutes instead of
        # summing all 16 on one runner. `--include-features` restricts cargo-hack's
        # `--each-feature` iteration to exactly the listed names (verified: still one nextest
        # invocation per feature, not one invocation with all of them enabled together) — a
        # future 15th ecosystem feature should be added to the shortest `run:` list below.
        include:
          - name: baseline
            run: |
              cargo nextest run -p deps-lsp --all-features --profile ci --no-fail-fast
              cargo nextest run -p deps-lsp --no-default-features --profile ci --no-fail-fast
          - name: ecosystems-1
            run: cargo hack nextest run -p deps-lsp --each-feature --include-features "bundler, cargo, composer, dart, deno" --keep-going --profile ci --no-fail-fast
          - name: ecosystems-2
            run: cargo hack nextest run -p deps-lsp --each-feature --include-features "github-actions, gitlab-ci, go, gradle, maven" --keep-going --profile ci --no-fail-fast
          - name: ecosystems-3
            run: cargo hack nextest run -p deps-lsp --each-feature --include-features "npm, nuget, pypi, swift" --keep-going --profile ci --no-fail-fast
          - name: deps-engine
            # deps-engine (issue #1059): small enough (80 tests as of the classification-layer
            # move) to run every feature slice in one shard rather than splitting like
            # deps-lsp's `ecosystems-*` legs above — revisit if its test count grows enough to
            # dominate this leg's wall-clock time. No separate `--all-features` line: unlike
            # the `ecosystems-*` shards above, this `--each-feature` invocation uses neither
            # `--include-features` nor `--exclude-features`, so cargo-hack already runs the
            # all-features case as one of its slices (`cargo hack --help`) — a standalone line
            # would duplicate that slice for zero extra coverage.
            run: cargo hack nextest run -p deps-engine --each-feature --keep-going --profile ci --no-fail-fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          cache-extra-identifier: feature-matrix-test-${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-hack and cargo-nextest
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-hack, cargo-nextest

      - name: Run tests for this shard
        # issue #1005: a hardcoded ecosystem-name lookup (e.g. `ecosystem_registry.get("cargo")`)
        # in a test can compile fine yet panic at runtime once that ecosystem's feature is
        # disabled — the `feature-matrix` job's clippy steps only prove compilation, not that
        # the resulting binary actually runs clean under every reduced feature set. No `--lib`:
        # nextest's default target set (lib + bins + tests) also covers the `tests/`
        # integration suites, which hardcode ecosystem names just as easily as unit tests do.
        # `--no-fail-fast`/`--keep-going` so one bad slice doesn't hide failures in the rest of
        # its shard, and `fail-fast: false` above does the same across shards. Generic name
        # (not "deps-lsp tests"): the `deps-engine` matrix leg (issue #1059) runs `matrix.run`
        # against `deps-engine`, not `deps-lsp` — a crate-specific title here would misattribute
        # that leg's failures in the Actions UI.
        run: ${{ matrix.run }}

  doc-and-hygiene:
    name: Doc + Hygiene
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          cache-extra-identifier: doc-hygiene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-machete
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        # Scoped to `crates` (not a bare `cargo machete`) so it never walks into
        # `crates/deps-zed` — a git submodule excluded from `[workspace]` in root
        # Cargo.toml, not a crate this repo's dependency hygiene applies to.
        run: cargo machete crates

      - name: Check documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Guard against test-util leaking into the release dependency tree
        # deps-core's `test-util` feature (see crates/deps-core/Cargo.toml) relaxes
        # ensure_https's HTTPS enforcement for loopback hosts and must never reach
        # deps-lsp's shipped binary. `-e features,no-dev` mirrors a release build:
        # it excludes dev-dependencies, so this fails if test-util is ever pulled
        # in through deps-lsp's normal (non-dev) dependency graph.
        #
        # The `ctl` self-check (test-util IS expected with dev-deps included) guards
        # against a `cargo tree` failure or output-format drift silently no-op'ing
        # this step: without it, an empty `tree` on either branch would pass.
        #
        # deps-engine (issue #1058) sits between the driving adapters and the ecosystem
        # crates and is a new potential leak path for the same carve-out, so it gets the
        # identical pair of checks. deps-cli (spec 062) is a second driving adapter reaching
        # deps-engine/deps-core the same way deps-lsp does, so it gets the same pair too.
        run: |
          tree=$(cargo tree -p deps-lsp -e features,no-dev)
          ctl=$(cargo tree -p deps-lsp -e features)
          grep -q 'feature "test-util"' <<<"$ctl" || { echo "::error::guard self-check failed"; exit 1; }
          grep -q 'feature "test-util"' <<<"$tree" && { echo "::error::deps-core's test-util feature is reachable from deps-lsp's non-dev dependency tree"; exit 1; }

          engine_tree=$(cargo tree -p deps-engine -e features,no-dev)
          engine_ctl=$(cargo tree -p deps-engine -e features)
          grep -q 'feature "test-util"' <<<"$engine_ctl" || { echo "::error::guard self-check failed for deps-engine"; exit 1; }
          grep -q 'feature "test-util"' <<<"$engine_tree" && { echo "::error::deps-core's test-util feature is reachable from deps-engine's non-dev dependency tree"; exit 1; }

          cli_tree=$(cargo tree -p deps-cli -e features,no-dev)
          cli_ctl=$(cargo tree -p deps-cli -e features)
          grep -q 'feature "test-util"' <<<"$cli_ctl" || { echo "::error::guard self-check failed for deps-cli"; exit 1; }
          grep -q 'feature "test-util"' <<<"$cli_tree" && { echo "::error::deps-core's test-util feature is reachable from deps-cli's non-dev dependency tree"; exit 1; }

          exit 0

      - name: Guard against tower-lsp-server leaking into deps-cli (issue #1083, spec 064)
        # FR-001/SC-001: deps-cli is a plain CLI/CI tool with no LSP client on the other
        # end, so linking tower-lsp-server there is pure dead weight (and, per the spec's
        # motivation, a supply-chain surface deps-cli has no reason to carry). `-e
        # features,no-dev` mirrors a release build (dev-dependencies excluded), so this
        # fails if tower-lsp-server is ever pulled into deps-cli's normal dependency graph
        # again — e.g. a future ecosystem crate change that makes `lsp-responses` default,
        # or a new direct dependency edge that forgets to opt out of it.
        #
        # The positive control uses deps-lsp instead of deps-cli itself: unlike the
        # test-util guard above, deps-cli's own dependency tree (dev-deps included) never
        # legitimately contains tower-lsp-server post-#1083, so there's no "expected on one
        # branch, forbidden on the other" shape to self-check against within deps-cli alone.
        # deps-lsp is the real LSP server and always links it, so a `cargo tree` output-
        # format drift or command failure that would silently no-op the grep below is still
        # caught.
        run: |
          lsp_ctl=$(cargo tree -p deps-lsp -e features,no-dev)
          grep -q 'tower-lsp-server' <<<"$lsp_ctl" || { echo "::error::guard self-check failed: tower-lsp-server not found in deps-lsp's own dependency tree"; exit 1; }

          cli_tree=$(cargo tree -p deps-cli -e features,no-dev)
          grep -q 'tower-lsp-server' <<<"$cli_tree" && { echo "::error::tower-lsp-server is reachable from deps-cli's non-dev dependency tree"; exit 1; }

          exit 0

      - name: Guard against driving-adapter crates depending on each other
        # The design's core invariant (issue #1058, architecture-decision.md §3.1): no
        # driving-adapter crate (deps-lsp, deps-cli today; deps-mcp once it exists) may
        # appear in another driving adapter's dependency tree. deps-mcp doesn't exist yet —
        # added by a later PR — so its own symmetric `cargo tree -p deps-mcp -e no-dev`
        # check is deferred until it does; add it to `adapters`/its own tree check then.
        #
        # The positive control (mirroring the test-util guard above) proves this detection
        # mechanism actually works, using a crate name (`deps-core`) known to be in the tree
        # today — an empty/malformed `cargo tree` output must not silently pass this guard.
        # The match itself is boundary-anchored on non-identifier characters (not `grep -w`'s
        # `\b`, which treats `-` as a boundary) so `deps-cli` cannot false-positive on a
        # hypothetical `deps-cli-utils` crate, AND requires the literal ` v<digit>` that
        # immediately follows a crate name in `cargo tree`'s own node format (`name vX.Y.Z
        # (path)`) — without this, the match also catches the substring "deps-lsp" inside a
        # checked-out *path*, not just the crate name: GitHub Actions' default checkout
        # directory for this repo is `/home/runner/work/deps-lsp/deps-lsp/...`, which every
        # local path-dependency line's `(...)` suffix embeds verbatim, so a plain substring
        # match against "deps-lsp" spuriously fires on every single tree entry in CI even
        # though "deps-lsp" the crate is nowhere in `deps-cli`'s actual dependency graph
        # (caught after the fact — this guard never ran in this PR's CI until the unrelated
        # test-util guard above it was fixed, since a step failure skips the rest of the job).
        run: |
          adapters=(deps-cli deps-mcp)
          tree=$(cargo tree -p deps-lsp -e no-dev)

          if ! grep -qE '(^|[^A-Za-z0-9._-])deps-core v[0-9]' <<<"$tree"; then
            echo "::error::guard self-check failed: deps-core not found in deps-lsp's own tree"
            exit 1
          fi

          for adapter in "${adapters[@]}"; do
            if grep -qE "(^|[^A-Za-z0-9._-])${adapter} v[0-9]" <<<"$tree"; then
              echo "::error::deps-lsp's dependency tree unexpectedly includes driving adapter $adapter"
              exit 1
            fi
          done

          cli_tree=$(cargo tree -p deps-cli -e no-dev)
          if ! grep -qE '(^|[^A-Za-z0-9._-])deps-core v[0-9]' <<<"$cli_tree"; then
            echo "::error::guard self-check failed: deps-core not found in deps-cli's own tree"
            exit 1
          fi
          if grep -qE '(^|[^A-Za-z0-9._-])deps-lsp v[0-9]' <<<"$cli_tree"; then
            echo "::error::deps-cli's dependency tree unexpectedly includes driving adapter deps-lsp"
            exit 1
          fi
          exit 0

      - name: Guard against ecosystem crates leaking into an adapter's release dependency tree
        # The design's other invariant (issue #1058, architecture-decision.md §3.1/§3.3): a
        # driving adapter may not name a concrete `deps-<ecosystem>` crate as a *direct*
        # non-dev dependency of its own — only `deps-engine` may. Issue #1073 was exactly
        # this: `deps-lsp` calling `deps_gitlab_ci::GitlabHost::parse` directly. `--depth 1`
        # is essential here, unlike the driving-adapter guard above: every ecosystem crate is
        # a *legitimate* transitive dependency of deps-lsp/deps-cli through deps-engine, so an
        # unbounded `cargo tree` would flag that expected transitive edge as a false positive
        # on every run — this check only cares whether the adapter's own `Cargo.toml` names
        # one directly. `--all-features` so the check exercises every ecosystem crate's
        # feature flag, not just an adapter's own default selection. Same boundary-anchored
        # grep technique as the driving-adapter guard above, and the same positive-control
        # shape (`deps-core` known-present as a direct dependency) to prove the detection
        # mechanism itself works.
        #
        # The crate list itself is derived from `deps-engine`'s own direct dependency tree
        # (minus `deps-core`/`deps-engine`), not hand-maintained here — a 15th ecosystem crate
        # added to `deps-engine` extends this check automatically instead of silently not
        # being covered (impl-critic S2). The `min_expected` floor is a self-check guarding
        # against a `cargo tree` output-format change silently emptying `ecosystems` and
        # turning every iteration below into a no-op.
        run: |
          mapfile -t ecosystems < <(
            cargo tree -p deps-engine -e no-dev --all-features --depth 1 \
              | grep -oE '(^|[^A-Za-z0-9._-])deps-[a-z-]+ v[0-9]' \
              | grep -oE 'deps-[a-z-]+' \
              | grep -vE '^(deps-core|deps-engine)$' \
              | sort -u
          )
          min_expected=10
          if [ "${#ecosystems[@]}" -lt "$min_expected" ]; then
            echo "::error::guard self-check failed: derived only ${#ecosystems[@]} ecosystem crate(s) from deps-engine's direct dependency tree (expected at least $min_expected) — cargo tree output format may have changed"
            exit 1
          fi

          lsp_tree=$(cargo tree -p deps-lsp -e no-dev --all-features --depth 1)
          if ! grep -qE '(^|[^A-Za-z0-9._-])deps-core v[0-9]' <<<"$lsp_tree"; then
            echo "::error::guard self-check failed: deps-core not found among deps-lsp's direct dependencies"
            exit 1
          fi
          for ecosystem in "${ecosystems[@]}"; do
            if grep -qE "(^|[^A-Za-z0-9._-])${ecosystem} v[0-9]" <<<"$lsp_tree"; then
              echo "::error::deps-lsp directly depends on ecosystem crate $ecosystem"
              exit 1
            fi
          done

          cli_tree=$(cargo tree -p deps-cli -e no-dev --all-features --depth 1)
          if ! grep -qE '(^|[^A-Za-z0-9._-])deps-core v[0-9]' <<<"$cli_tree"; then
            echo "::error::guard self-check failed: deps-core not found among deps-cli's direct dependencies"
            exit 1
          fi
          for ecosystem in "${ecosystems[@]}"; do
            if grep -qE "(^|[^A-Za-z0-9._-])${ecosystem} v[0-9]" <<<"$cli_tree"; then
              echo "::error::deps-cli directly depends on ecosystem crate $ecosystem"
              exit 1
            fi
          done
          exit 0

      - name: Guard against deps-engine directly depending on tower-lsp-server
        # Issue #1071: deps-engine's domain data (Dependency ranges, ParseResult::uri(),
        # LockFileProvider, etc.) was migrated off `tower_lsp_server::ls_types` onto
        # `deps_core::position::{Position,Range}`/`url::Url`, so deps-engine's own
        # `Cargo.toml` must never re-add `tower-lsp-server` as a direct dependency again.
        # This is deliberately a **direct**-dependency check (`--depth 1`), not a
        # transitive one: deps-engine still pulls tower-lsp-server transitively through
        # deps-core (accepted — deps-core's own `lsp_helpers` module independently builds
        # real `ls_types::{Hover,Diagnostic,CodeAction}` response objects, out of scope
        # for this spec and tracked separately as issue #1083). A plain `cargo tree -p
        # deps-engine | grep tower-lsp-server` would always match that expected
        # transitive edge and fail on every run — future contributors should not "fix"
        # this into a transitive check. Same boundary-anchored grep technique as the
        # other dependency-tree guards above.
        run: |
          tree=$(cargo tree -p deps-engine -e no-dev --all-features --depth 1)
          if ! grep -qE '(^|[^A-Za-z0-9._-])deps-core v[0-9]' <<<"$tree"; then
            echo "::error::guard self-check failed: deps-core not found among deps-engine's direct dependencies — cargo tree output format may have changed"
            exit 1
          fi
          if grep -qE '(^|[^A-Za-z0-9._-])tower-lsp-server v[0-9]' <<<"$tree"; then
            echo "::error::deps-engine directly depends on tower-lsp-server (issue #1071 regression)"
            exit 1
          fi
          exit 0

      - name: Guard against a `..` rest pattern in PolicyConfig::diff / reparse_scope (#1064)
        # Issue #1064/#592 M1: `PolicyConfig::diff` (deps-core) and `reparse_scope` (deps-lsp)
        # must destructure every field of every `policy_config` section exhaustively — no `..`
        # rest pattern at any level — so a field added to any of the 7 `#[non_exhaustive]`
        # policy section structs forces a compile-time decision (rustc E0027) instead of being
        # silently ignored. `policy_config.rs`'s `PolicyConfigDiff` doctest only illustrates
        # that underlying language mechanism on a synthetic, unrelated struct (see its own doc
        # comment) — it does NOT re-verify these two real function bodies stay `..`-free. This
        # step does, on every PR, by isolating each function's body (from its signature to its
        # own closing brace, found by indentation) and scanning it for a rest pattern.
        #
        # Detection matches, each anchored on the left by start-of-line, `,`, or `{` (the only
        # three positions a struct-pattern/literal's rest element can follow) so a plain range
        # or slice expression (`0..len`, `&s[..end]`) can never false-positive: a `..` rest
        # pattern on its own line (the common multi-line rustfmt shape); `, ..`/`{ ..`
        # immediately followed by `,`/`}` (the single-line bare rest-pattern shape); and `..`
        # immediately followed by an identifier in any of those same three left contexts (the
        # functional-record-update shape, e.g. `..Default::default()` or `..old` — legal today
        # because `PolicyConfigDiff` derives `Default`, and just as capable of silently
        # dropping a field as a bare `..` is). reviewer-prB caught two gaps in earlier versions
        # of this guard by actually running it, not just reading it: the functional-update
        # shape being undetected at all, and then the first fix for that being unanchored and
        # false-positive-prone on ranges — both are what the left-context anchoring above
        # closes. Comment lines are excluded first so a doc comment's own `` `..` `` prose (as
        # in this file's module docs) can't false-positive — this only strips lines *starting*
        # with `//`, not a trailing inline comment; no such line exists in either function
        # today, so this is a known, accepted limitation rather than a fix. The positive/
        # negative controls below (mirroring this job's other tree-based guards) prove the
        # isolation + detection actually catches each real shape and ignores each range/slice
        # shape, using synthetic snippets — a change to either function's signature/indentation
        # that silently empties the isolated body, or a detection regex that regresses in
        # either direction, must not silently pass this guard.
        run: |
          dotdot_pattern='(^[[:space:]]*\.\.[[:space:]]*$)|(,[[:space:]]*\.\.[[:space:]]*[,}])|(\{[[:space:]]*\.\.[[:space:]]*[,}])|(^[[:space:]]*\.\.[A-Za-z_])|(,[[:space:]]*\.\.[A-Za-z_])|(\{[[:space:]]*\.\.[A-Za-z_])'

          check_no_dotdot() {
            # `-v` names avoid awk's builtin `close()` function (using it as a plain variable
            # name is a syntax error on some awk implementations, e.g. macOS's default awk) —
            # discovered while writing this guard, not a hypothetical. Patterns use `\\(`/`\\{`
            # (double backslash), not `\(`/`\{`: awk's `-v` assignment itself unescapes one
            # level of backslash before the regex engine ever sees it.
            local file="$1" start_pattern="$2" closeln="$3" label="$4"
            local body
            body=$(awk -v start="$start_pattern" -v closeln="$closeln" '
              $0 ~ start { found=1 }
              found { print }
              found && $0 == closeln { exit }
            ' "$file")
            if [ -z "$body" ]; then
              echo "::error::guard self-check failed: could not isolate $label's body in $file — its signature or indentation may have changed"
              exit 1
            fi
            if grep -vE '^[[:space:]]*//' <<<"$body" | grep -qE "$dotdot_pattern"; then
              echo "::error::$label contains a '..' rest pattern — this defeats issue #1064/#592's exhaustive-destructure guarantee"
              exit 1
            fi
          }

          check_no_dotdot "crates/deps-core/src/policy_config.rs" 'pub fn diff\\(old: &Self, new: &Self\\) -> PolicyConfigDiff \\{' '    }' "PolicyConfig::diff"
          check_no_dotdot "crates/deps-lsp/src/config.rs" 'pub\\(crate\\) fn reparse_scope\\(' '}' "reparse_scope"

          # Positive controls: both the single-line and multi-line rest-pattern shapes must
          # be caught, and a doc comment merely mentioning `..` in prose must not be.
          if ! grep -vE '^[[:space:]]*//' <<<'let Example { a: _, .. } = e;' | grep -qE "$dotdot_pattern"; then
            echo "::error::guard self-check failed: the '..' detection regex does not fire on a single-line rest pattern"
            exit 1
          fi
          if ! grep -vE '^[[:space:]]*//' <<<$'let Example {\n    a: _,\n    ..\n} = e;' | grep -qE "$dotdot_pattern"; then
            echo "::error::guard self-check failed: the '..' detection regex does not fire on a multi-line rest pattern"
            exit 1
          fi
          if ! grep -vE '^[[:space:]]*//' <<<'PolicyConfigDiff { workspace_registries_changed: x, ..Default::default() }' | grep -qE "$dotdot_pattern"; then
            echo "::error::guard self-check failed: the '..' detection regex does not fire on a functional-record-update expression (..Default::default())"
            exit 1
          fi
          if grep -vE '^[[:space:]]*//' <<<'    // mentions `..` in prose only' | grep -qE "$dotdot_pattern"; then
            echo "::error::guard self-check failed: the '..' detection regex false-positives on a comment"
            exit 1
          fi

          # Negative controls: ordinary range/slice expressions unrelated to a struct rest
          # pattern must NOT be flagged (reviewer-prB caught this false-positive class in an
          # earlier, unanchored version of the identifier alternative).
          for range_expr in 'for i in 0..len {' '&s[..end]' 'for i in start..end {' 'Foo { field: 0..len }'; do
            if grep -vE '^[[:space:]]*//' <<<"$range_expr" | grep -qE "$dotdot_pattern"; then
              echo "::error::guard self-check failed: the '..' detection regex false-positives on range/slice expression: $range_expr"
              exit 1
            fi
          done
          exit 0

  semver:
    name: Semver Check
    needs: changes
    # Advisory only again (#1048), reverting #945/PR #1012's blocking gate. That change's
    # premise held for genuine breaking changes (proven by the 2026-09-13 scheduled-run
    # catch, #904/#1010), but in practice the blocking gate also fires on incidental,
    # non-breaking additive changes that are a normal byproduct of routine internal work
    # across this workspace's many small `publish = true` ecosystem crates — e.g. PR #1044
    # (a test-only hardening fix, no intentional public-API change) was blocked by
    # `inherent_method_must_use_added` on `RubyGemsRegistry::new`, where `#[must_use]` was
    # added only to satisfy this workspace's `clippy::pedantic` lint after restoring the
    # method's `const`-ness. `cargo-semver-checks` is technically correct that this needs a
    # minor bump under strict semver, but these crates evolve together at one workspace
    # version and are consumed primarily through `deps-lsp`'s own `Ecosystem` wiring rather
    # than as independently-versioned libraries in practice — so the check's
    # independent-library assumptions produce more merge-blocking noise than signal here.
    # PR/push runs stay non-blocking again; the weekly scheduled sweep still hard-fails and
    # files/updates a tracking issue, so a genuine breaking change is never silently lost —
    # it just doesn't block an individual PR anymore. Not part of `ci-success`'s `needs`.
    if: github.event_name == 'schedule' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239  # v2.9
        with:
          feature-group: all-features

      - name: File or update tracking issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        run: |
          title="semver: cargo-semver-checks failed in scheduled run"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Scheduled semver-check run ${run_url} failed.

          This job is part of the weekly regression sweep (\`.github/workflows/ci.yml\`, job \`semver\`), advisory-only on PR/push again since #1048. See the run log for the semver-violation or build-failure detail — a failure here that also reproduces on a PR/push run's non-blocking check is a real breaking-change candidate worth its own fix, not noise from an incidental additive change."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug --label testing-infra
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Security Audit
    needs: changes
    # gitleaks scans the whole checked-out tree regardless of which paths changed, so a
    # workflow-only PR (like the one that wired gitleaks in) needs to trigger this job too,
    # not just rust changes — otherwise the step can merge without ever having run.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install cargo-deny
        uses: taiki-e/install-action@5724fe4561a201b0d36bddf13177e3557b43787b  # cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

      - name: Run gitleaks
        # bug-ops is a personal account, not an organization (verified via `gh api
        # users/bug-ops --jq '{login, type, name}'` -> "type": "User"), so
        # gitleaks-action's GITLEAKS_LICENSE requirement (free, but org-account-only)
        # does not apply here — per the action's README, "If you are scanning repos that
        # belong to a personal account, then no license key is required." Auto-discovers
        # .gitleaks.toml (#803) from the repo root, same precedence as the bare CLI, so
        # no extra config flag is needed. Requires `fetch-depth: 0` above: `Scan()` always
        # runs `git log --no-merges --first-parent <base>^..<head>`, which needs history
        # beyond the default shallow checkout. `pull-requests: write` above is required
        # too: `ScanPullRequest()`'s commit-listing call isn't wrapped in try/catch and
        # 403s without it. GITLEAKS_VERSION pins the scanner explicitly — the action
        # otherwise defaults to an older hardcoded version.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  test:
    name: Test (${{ matrix.os }}${{ matrix.rust != 'stable' && format(' / {0}', matrix.rust) || '' }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: ${{ matrix.rust }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@ef6302df50adb496d123b03ae2b53322d688ffa1  # nextest

      - name: Run tests
        run: cargo nextest run --workspace --all-features --no-fail-fast --profile ci

      - name: Run doctests
        run: cargo test --workspace --doc --all-features

  cross-check:
    name: Cross-compile Check (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross_tool: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross_tool: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross_tool: true
          - os: ubuntu-latest
            # 32-bit leg: gives `#[cfg(target_pointer_width = "32")]` fail-closed guards
            # (e.g. crates/deps-core/src/xml_bounds.rs) a real 32-bit target to build
            # and test against, since every other leg here is 64-bit. Built natively
            # (gcc-multilib, no `cross`/Docker) rather than via musl-cross like the
            # other Linux legs below: i686 binaries already run natively on this
            # x86_64 runner (no QEMU needed either way), and glibc's multilib support
            # lets the toolchain cross-compile directly, avoiding cross's musl-container
            # apt-get/Docker overhead (see #815) for a leg that exists purely to
            # exercise one guard. This leg alone also runs its test suite via
            # `cargo nextest`, not just a build.
            target: i686-unknown-linux-gnu
            use_cross_tool: false
            run_tests: true
            native_multilib: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          targets: ${{ matrix.target }}
          cache-target: ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross
        if: matrix.use_cross_tool
        uses: taiki-e/install-action@a82845735191974ac374fc0472388c6df0a158ca  # cross

      # i686-unknown-linux-gnu builds natively on this x86_64 runner via glibc
      # multilib support instead of `cross`/Docker (see the matrix comment above).
      # gcc-multilib/libc6-dev-i386 provide the 32-bit C runtime and linker support
      # rustc needs; cmake (for aws-lc-sys, pulled in transitively via reqwest's
      # rustls/aws-lc-rs backend) already ships on the `ubuntu-latest` image.
      - name: Install 32-bit multilib toolchain
        if: matrix.native_multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Install nextest
        if: matrix.run_tests && matrix.native_multilib
        uses: taiki-e/install-action@ef6302df50adb496d123b03ae2b53322d688ffa1  # nextest

      # `cross`'s `pre-build` steps for the musl targets (.github/Cross.toml) run `apt-get
      # update && apt-get install cmake` inside a fresh Docker image build on every
      # run — needed because aws-lc-sys (pulled in transitively via reqwest's
      # rustls/aws-lc-rs backend) requires cmake to cross-compile, which the stock
      # cross-rs musl images don't ship. That `apt-get update` hits Ubuntu 18.04's
      # archive mirror, observed taking 6-7+ minutes on its own (a single `Fetched
      # 48.5 MB in 6min 42s (121 kB/s)` run) and accounts for most of this job's
      # wall time — see #815 for the mirror-flakiness background.
      #
      # `cross` tags the image it builds with a content hash of the Dockerfile/
      # pre-build commands and skips rebuilding whenever an image with that exact
      # tag already exists locally, so restoring a previously built image via
      # `docker load` before invoking `cross build` lets it skip the apt-get step
      # entirely on a cache hit. `docker save`/`load` preserves the tag, so we
      # don't need to know cross's hash ourselves.
      - name: Cache cross custom Docker image
        if: matrix.use_cross_tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cross-image-cache
        with:
          path: /tmp/cross-image-cache
          key: cross-image-${{ matrix.target }}-${{ hashFiles('.github/Cross.toml') }}-v1

      - name: Load cached cross custom Docker image
        if: matrix.use_cross_tool && steps.cross-image-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f "/tmp/cross-image-cache/${{ matrix.target }}.tar" ]; then
            docker load -i "/tmp/cross-image-cache/${{ matrix.target }}.tar"
          fi

      - name: Build for cross-compile target
        if: ${{ !matrix.use_cross_tool }}
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Build for cross-compile target (musl via cross)
        if: matrix.use_cross_tool
        env:
          CROSS_CONFIG: .github/Cross.toml
        run: cross build --workspace --target ${{ matrix.target }}

      # Populates the cache path for the `actions/cache` step above to pick up and
      # upload at job end (its automatic post-step). Skipped on a cache hit (no new
      # image was built, nothing changed to save). `always()` so a cargo-level build
      # failure (unrelated to the image) doesn't discard the already-paid-for
      # apt-get work.
      - name: Save cross custom Docker image to cache
        if: always() && matrix.use_cross_tool && steps.cross-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cross-image-cache
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^cross-custom-' || true)
          if [ -n "$images" ]; then
            docker save $images -o "/tmp/cross-image-cache/${{ matrix.target }}.tar"
          fi

      - name: Run tests for cross-compile target (exercises pointer-width guards)
        # Native build (i686-unknown-linux-gnu, matrix.native_multilib) runs via
        # `cargo nextest`, same as the main `test` job — nextest's per-test-process
        # isolation avoids the shared-counter races that `deps_core::fs_probe`'s
        # global stat/read counters (e.g. deps-gradle's
        # test_load_gradle_properties_stats_exactly_once_per_ancestor) would otherwise
        # hit under a single-process `cargo test`, so no `--test-threads=1` workaround
        # is needed here.
        if: matrix.run_tests && matrix.native_multilib
        run: cargo nextest run --workspace --all-features --no-fail-fast --target ${{ matrix.target }}

  coverage:
    name: Code Coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest, cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info nextest --profile coverage

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  msrv:
    name: Check MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$MSRV" >> $GITHUB_OUTPUT

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: ${{ steps.msrv.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check with MSRV
        run: cargo check --workspace --all-features

  benchmark:
    name: Check Benchmarks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build benchmarks
        # `deps-core/test-util` is currently unified in for free via every ecosystem crate's
        # own dev-dependency edge, but passed explicitly here too so this build does not
        # silently start skipping `core_benchmarks` if that unification path ever changes.
        # `deps-nuget/test-util` has no such sibling unification (nothing else depends on
        # `deps-nuget` with this feature), so it must be passed explicitly or a bare
        # `--workspace --benches` silently skips `nuget_benchmarks` — its
        # `parse_flat_container_for_bench` is gated behind it — rather than failing (#835 M1).
        run: cargo build --workspace --benches --features deps-core/test-util,deps-nuget/test-util

  fuzz-tool:
    name: Build cargo-fuzz
    needs: changes
    # Same trigger condition as `fuzz` below: the weekly scheduled sweep always builds the
    # tool it needs, and PR/push runs only build it when there's something to fuzz.
    if: github.event_name == 'schedule' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: nightly
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-nightly-v1

      - name: Install cargo-fuzz
        # `taiki-e/install-action` has no `cargo-fuzz` manifest (verified: not present in
        # https://github.com/taiki-e/install-action/tree/main/manifests) — the previous
        # attempt here (`uses: taiki-e/install-action@...  # cargo-fuzz`, no `with.tool`)
        # silently installed the SHA's *default* tool, cargo-deny. `cargo install` from
        # source instead, built once here and shared across the 18-leg `fuzz` matrix
        # below via cache + artifact rather than reinstalled independently in each leg.
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-fuzz-bin
          path: ~/.cargo/bin/cargo-fuzz
          retention-days: 1

  fuzz:
    name: Fuzz (bounded)
    needs: [changes, fuzz-tool]
    # Deliberately not in `ci-success`'s `needs` (#673): a bounded regression run, not a
    # merge gate — a flaky/slow nightly toolchain or libFuzzer environment issue here must
    # never block an otherwise-green PR (fuzzing did find a real bug during development —
    # the `pep508_rs` panic in `.local/testing/regressions.md` — so this is a real signal
    # channel, just not one that should ever fail someone else's unrelated PR).
    # `continue-on-error` is conditional (#701): PR/push runs stay non-blocking exactly as
    # before, but the weekly scheduled sweep (`github.event_name == 'schedule'`) hard-fails
    # and the "File or update tracking issue" step below opens/updates a GitHub issue, so a
    # regression in this job is no longer silent.
    # `fuzz/` is its own nested workspace (see `fuzz/Cargo.toml`), independent of the root
    # `[workspace.lints]`/`unsafe_code = "forbid"` this job's targets don't need to satisfy.
    #
    # `github.event_name == 'schedule'` is included in `if` (not just in `continue-on-error`)
    # because `changes.outputs.rust`/`workflows` reflect only the most recent commit's diff
    # (#701) — without this, a doc-only last commit on `main` would skip the entire weekly
    # regression sweep, not just report it quietly.
    if: github.event_name == 'schedule' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # `pypi_requirement` is deliberately excluded: `pep508_rs` 0.9.2 panics on certain
        # malformed package names (see `.local/testing/regressions.md`), which the
        # application code already catches via `catch_unwind` — but `libfuzzer-sys`
        # installs its own panic hook that aborts on *any* panic regardless, so this
        # target would always report a "crash" here even though the real request path is
        # protected (verified by a passing unit test). Run it locally/manually instead.
        target:
          - parser_checks
          - parse_json_checked
          - json_ast
          - bundler_parser
          - go_parser
          - swift_parser
          - gradle_parser
          - maven_parser
          - nuget_parser
          - registry_xml_parser
          - github_actions_parser
          - gitlab_ci_parser
          - dart_parser
          - dart_lockfile
          - pnpm_lockfile
          - pnpm_catalog
          - fallback_completion
          - redact_userinfo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: nightly
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `moonrepo/setup-rust`'s own caching (`cache-target`/`target-dirs`) saves/restores the
      # raw `target/` directory verbatim, but its pre-save `cargo cache --autoclean` step
      # deletes the extracted registry `src/` checkouts (keeping only the compressed `.crate`
      # archives) to shrink the cache. On restore, cargo has to re-extract every dependency's
      # source with a fresh mtime, which invalidates the mtime-based fingerprint checks in the
      # restored `target/` dir and cascades into a full rebuild of the entire dependency graph
      # (verified empirically: even foundational, unchanged crates like `proc-macro2` were
      # recompiled after a confirmed cache hit and successful restore). `Swatinem/rust-cache`
      # is the standard tool for this exact scenario — nested Cargo workspaces via
      # `workspaces:`, one shared cache across matrix legs via `shared-key:` (they compile the
      # same dependency tree; only the final fuzz-target binary differs) — and specifically
      # designed to avoid the mtime-invalidation trap above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-fuzz-bin
          path: ~/.cargo/bin

      - name: Make cargo-fuzz executable
        # Built once in `fuzz-tool` and shared here via artifact instead of each of the
        # 18 matrix legs independently running `cargo install cargo-fuzz --locked`.
        run: chmod +x ~/.cargo/bin/cargo-fuzz

      - name: Run ${{ matrix.target }} for 60s
        working-directory: fuzz
        # `seeds/<target>/` (issue #727), when present, is a tracked, read-only starting
        # corpus — libFuzzer only ever writes newly-discovered interesting inputs back into
        # the first CORPUS directory (the auto-managed, gitignored `corpus/<target>/`), never
        # into later ones, so this cannot mutate the tracked seeds. Targets whose key-driven
        # YAML dispatch (a whole-string compare on a mapping key, e.g. `value == "uses"`) gives
        # libFuzzer no per-byte coverage gradient need this to reach the real dependency-
        # extraction code within the 60s budget, rather than only ever re-deriving syntactically
        # valid YAML that never contains the right key text.
        run: |
          seed_dir="seeds/${{ matrix.target }}"
          if [ -d "$seed_dir" ]; then
            # libFuzzer requires the (mutable) main corpus directory to already exist when
            # any CORPUS argument is passed explicitly — unlike the no-argument default form
            # below, it won't create it on its own.
            mkdir -p "corpus/${{ matrix.target }}"
            cargo +nightly fuzz run ${{ matrix.target }} "corpus/${{ matrix.target }}" "$seed_dir" -- -max_total_time=60
          else
            cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
          fi

      - name: File or update tracking issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        run: |
          title="fuzz: ${TARGET} failed in scheduled run"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Scheduled fuzz run ${run_url} failed for target \`${TARGET}\`.

          This target is part of the weekly regression sweep (\`.github/workflows/ci.yml\`, job \`fuzz\`). See the run log for the crash/build failure detail."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label security --label testing-infra
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}

  release-check:
    name: Release Build Check
    needs: [test]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          cache-target: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release
        # Deliberately not --all-features: this must mirror the shipped binary's
        # configuration (default features), otherwise it would enable deps-core's
        # test-util feature (see crates/deps-core/Cargo.toml) in a release build.
        run: cargo build --workspace --release

      - name: Check binary size
        run: |
          ls -lh target/release/
          du -sh target/release/

  ci-success:
    name: CI Success
    needs:
      [
        changes,
        fmt,
        clippy,
        fuzz-check,
        feature-matrix,
        feature-matrix-test,
        doc-and-hygiene,
        security,
        test,
        cross-check,
        coverage,
        msrv,
        benchmark,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.changes.outputs.rust }}" != "true" && "${{ needs.changes.outputs.workflows }}" != "true" ]]; then
            echo "No relevant changes - skipped jobs are OK"
            exit 0
          fi

          check_job() {
            local result="$1"
            local name="$2"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Job $name failed: $result"
              return 1
            fi
            return 0
          }

          failed=0
          check_job "${{ needs.fmt.result }}" "fmt" || failed=1
          check_job "${{ needs.clippy.result }}" "clippy" || failed=1
          check_job "${{ needs.fuzz-check.result }}" "fuzz-check" || failed=1
          check_job "${{ needs.feature-matrix.result }}" "feature-matrix" || failed=1
          check_job "${{ needs.feature-matrix-test.result }}" "feature-matrix-test" || failed=1
          check_job "${{ needs.doc-and-hygiene.result }}" "doc-and-hygiene" || failed=1
          check_job "${{ needs.security.result }}" "security" || failed=1
          check_job "${{ needs.test.result }}" "test" || failed=1
          check_job "${{ needs.cross-check.result }}" "cross-check" || failed=1
          check_job "${{ needs.coverage.result }}" "coverage" || failed=1
          check_job "${{ needs.msrv.result }}" "msrv" || failed=1
          check_job "${{ needs.benchmark.result }}" "benchmark" || failed=1

          if [[ $failed -eq 1 ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed successfully!"
