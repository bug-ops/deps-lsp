name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly dependency check

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
            workflows:
              - '.github/workflows/**'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: nightly
          components: rustfmt
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          components: clippy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-machete
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c  # v2
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        # Scoped to `crates` (not a bare `cargo machete`) so it never walks into
        # `crates/deps-zed` — a git submodule excluded from `[workspace]` in root
        # Cargo.toml, not a crate this repo's dependency hygiene applies to.
        run: cargo machete crates

      - name: Check documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Guard against test-util leaking into the release dependency tree
        # deps-core's `test-util` feature (see crates/deps-core/Cargo.toml) relaxes
        # ensure_https's HTTPS enforcement for loopback hosts and must never reach
        # deps-lsp's shipped binary. `-e features,no-dev` mirrors a release build:
        # it excludes dev-dependencies, so this fails if test-util is ever pulled
        # in through deps-lsp's normal (non-dev) dependency graph.
        #
        # The `ctl` self-check (test-util IS expected with dev-deps included) guards
        # against a `cargo tree` failure or output-format drift silently no-op'ing
        # this step: without it, an empty `tree` on either branch would pass.
        run: |
          tree=$(cargo tree -p deps-lsp -e features,no-dev)
          ctl=$(cargo tree -p deps-lsp -e features)
          grep -q 'feature "test-util"' <<<"$ctl" || { echo "::error::guard self-check failed"; exit 1; }
          grep -q 'feature "test-util"' <<<"$tree" && { echo "::error::deps-core's test-util feature is reachable from deps-lsp's non-dev dependency tree"; exit 1; }
          exit 0

  security:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@5724fe4561a201b0d36bddf13177e3557b43787b  # cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

  test:
    name: Test (${{ matrix.os }}${{ matrix.rust != 'stable' && format(' / {0}', matrix.rust) || '' }})
    needs: [changes, fmt, check]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: ${{ matrix.rust }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@ef6302df50adb496d123b03ae2b53322d688ffa1  # nextest

      - name: Run tests
        run: cargo nextest run --workspace --all-features --no-fail-fast --profile ci

      - name: Run doctests
        run: cargo test --workspace --doc --all-features

  cross-check:
    name: Cross-compile Check (${{ matrix.target }})
    needs: [changes, fmt]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross_tool: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross_tool: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross_tool: true

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          targets: ${{ matrix.target }}
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross
        if: matrix.use_cross_tool
        uses: taiki-e/install-action@a82845735191974ac374fc0472388c6df0a158ca  # cross

      - name: Build for cross-compile target
        if: ${{ !matrix.use_cross_tool }}
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Build for cross-compile target (musl via cross)
        if: matrix.use_cross_tool
        run: cross build --workspace --target ${{ matrix.target }}

  coverage:
    name: Code Coverage
    needs: [changes, fmt, check]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c  # v2
        with:
          tool: cargo-nextest, cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info nextest --profile coverage

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  msrv:
    name: Check MSRV
    needs: [changes, fmt, check]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$MSRV" >> $GITHUB_OUTPUT

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: ${{ steps.msrv.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check with MSRV
        run: cargo check --workspace --all-features

  wasm:
    name: WASM Build (Zed Extension)
    needs: [changes, fmt, check]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          submodules: true

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          targets: wasm32-wasip1
          cache-target: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Zed extension
        working-directory: crates/deps-zed
        run: cargo build --target wasm32-wasip1 --release

      - name: Check WASM size
        run: |
          ls -lh crates/deps-zed/target/wasm32-wasip1/release/*.wasm
          du -sh crates/deps-zed/target/wasm32-wasip1/release/*.wasm

  benchmark:
    name: Check Benchmarks
    needs: [changes, fmt, check]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build benchmarks
        run: cargo build --workspace --benches

  fuzz:
    name: Fuzz (bounded)
    needs: [changes, fmt, check]
    # Deliberately not in `ci-success`'s `needs` (#673): a bounded regression run, not a
    # merge gate — a flaky/slow nightly toolchain or libFuzzer environment issue here must
    # never block an otherwise-green PR (fuzzing did find a real bug during development —
    # the `pep508_rs` panic in `.local/testing/regressions.md` — so this is a real signal
    # channel, just not one that should ever fail someone else's unrelated PR).
    # `continue-on-error` is conditional (#701): PR/push runs stay non-blocking exactly as
    # before, but the weekly scheduled sweep (`github.event_name == 'schedule'`) hard-fails
    # and the "File or update tracking issue" step below opens/updates a GitHub issue, so a
    # regression in this job is no longer silent.
    # `fuzz/` is its own nested workspace (see `fuzz/Cargo.toml`), independent of the root
    # `[workspace.lints]`/`unsafe_code = "forbid"` this job's targets don't need to satisfy.
    #
    # `github.event_name == 'schedule'` is included in `if` (not just in `continue-on-error`)
    # because `changes.outputs.rust`/`workflows` reflect only the most recent commit's diff
    # (#701) — without this, a doc-only last commit on `main` would skip the entire weekly
    # regression sweep, not just report it quietly.
    if: github.event_name == 'schedule' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # `pypi_requirement` is deliberately excluded: `pep508_rs` 0.9.2 panics on certain
        # malformed package names (see `.local/testing/regressions.md`), which the
        # application code already catches via `catch_unwind` — but `libfuzzer-sys`
        # installs its own panic hook that aborts on *any* panic regardless, so this
        # target would always report a "crash" here even though the real request path is
        # protected (verified by a passing unit test). Run it locally/manually instead.
        target:
          - parser_checks
          - parse_json_checked
          - json_ast
          - bundler_parser
          - go_parser
          - swift_parser
          - gradle_parser
          - maven_parser
          - nuget_parser
          - registry_xml_parser
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          channel: nightly
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-fuzz
        # `taiki-e/install-action` has no `cargo-fuzz` manifest (verified: not present in
        # https://github.com/taiki-e/install-action/tree/main/manifests) — the previous
        # attempt here (`uses: taiki-e/install-action@...  # cargo-fuzz`, no `with.tool`)
        # silently installed the SHA's *default* tool, cargo-deny, and this job could never
        # actually run a fuzz target. `cargo install` from source instead.
        run: cargo install cargo-fuzz --locked

      - name: Run ${{ matrix.target }} for 60s
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

      - name: File or update tracking issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        run: |
          title="fuzz: ${TARGET} failed in scheduled run"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Scheduled fuzz run ${run_url} failed for target \`${TARGET}\`.

          This target is part of the weekly regression sweep (\`.github/workflows/ci.yml\`, job \`fuzz\`). See the run log for the crash/build failure detail."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title \"${title}\"" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label security --label testing-infra
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}

  release-check:
    name: Release Build Check
    needs: [test]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          cache-target: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release
        # Deliberately not --all-features: this must mirror the shipped binary's
        # configuration (default features), otherwise it would enable deps-core's
        # test-util feature (see crates/deps-core/Cargo.toml) in a release build.
        run: cargo build --workspace --release

      - name: Check binary size
        run: |
          ls -lh target/release/
          du -sh target/release/

  ci-success:
    name: CI Success
    needs:
      [
        changes,
        fmt,
        check,
        security,
        test,
        cross-check,
        coverage,
        msrv,
        wasm,
        benchmark,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.changes.outputs.rust }}" != "true" && "${{ needs.changes.outputs.workflows }}" != "true" ]]; then
            echo "No relevant changes - skipped jobs are OK"
            exit 0
          fi

          check_job() {
            local result="$1"
            local name="$2"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Job $name failed: $result"
              return 1
            fi
            return 0
          }

          failed=0
          check_job "${{ needs.fmt.result }}" "fmt" || failed=1
          check_job "${{ needs.check.result }}" "check" || failed=1
          check_job "${{ needs.security.result }}" "security" || failed=1
          check_job "${{ needs.test.result }}" "test" || failed=1
          check_job "${{ needs.cross-check.result }}" "cross-check" || failed=1
          check_job "${{ needs.coverage.result }}" "coverage" || failed=1
          check_job "${{ needs.msrv.result }}" "msrv" || failed=1
          check_job "${{ needs.wasm.result }}" "wasm" || failed=1
          check_job "${{ needs.benchmark.result }}" "benchmark" || failed=1

          if [[ $failed -eq 1 ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed successfully!"
