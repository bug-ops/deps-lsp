name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.6.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release v${{ steps.get_version.outputs.version }}

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use_cross: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use_cross: false

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            use_cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          targets: ${{ matrix.target }}
          bins: cross
          cache-target: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release (cross)
        if: matrix.use_cross
        run: |
          cross build --package deps-lsp --release --target ${{ matrix.target }}
          cross build --package deps-cli --release --target ${{ matrix.target }}

      - name: Build release (native)
        if: "!matrix.use_cross"
        run: |
          cargo build --package deps-lsp --release --target ${{ matrix.target }}
          cargo build --package deps-cli --release --target ${{ matrix.target }}

      - name: Get binary names
        id: binary
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "lsp_name=deps-lsp.exe" >> $GITHUB_OUTPUT
            echo "cli_name=deps-cli.exe" >> $GITHUB_OUTPUT
          else
            echo "lsp_name=deps-lsp" >> $GITHUB_OUTPUT
            echo "cli_name=deps-cli" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Strip binaries (Linux/macOS, native only)
        if: matrix.os != 'windows-latest' && !matrix.use_cross
        run: |
          strip target/${{ matrix.target }}/release/${{ steps.binary.outputs.lsp_name }}
          strip target/${{ matrix.target }}/release/${{ steps.binary.outputs.cli_name }}

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../deps-lsp-${{ matrix.target }}.tar.gz ${{ steps.binary.outputs.lsp_name }}
          tar czf ../../../deps-cli-${{ matrix.target }}.tar.gz ${{ steps.binary.outputs.cli_name }}
          cd ../../..
          shasum -a 256 deps-lsp-${{ matrix.target }}.tar.gz > deps-lsp-${{ matrix.target }}.tar.gz.sha256
          shasum -a 256 deps-cli-${{ matrix.target }}.tar.gz > deps-cli-${{ matrix.target }}.tar.gz.sha256

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../deps-lsp-${{ matrix.target }}.zip ${{ steps.binary.outputs.lsp_name }}
          7z a ../../../deps-cli-${{ matrix.target }}.zip ${{ steps.binary.outputs.cli_name }}
          cd ../../..
          certUtil -hashfile deps-lsp-${{ matrix.target }}.zip SHA256 > deps-lsp-${{ matrix.target }}.zip.sha256
          certUtil -hashfile deps-cli-${{ matrix.target }}.zip SHA256 > deps-cli-${{ matrix.target }}.zip.sha256
        shell: cmd

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts (Sigstore keyless)
        # Keyless signing via GitHub Actions OIDC (id-token: write above) — no key material
        # to manage. `shell: bash` so this one step covers both the tar.gz (Unix) and zip
        # (Windows) branches uniformly; GitHub-hosted windows-latest runners ship Git Bash.
        # cosign v3 defaults sign-blob to a single bundle file and silently ignores
        # --output-signature/--output-certificate unless --new-bundle-format=false is set.
        shell: bash
        run: |
          for f in "deps-lsp-${{ matrix.target }}.${{ matrix.archive }}" "deps-cli-${{ matrix.target }}.${{ matrix.archive }}"; do
            cosign sign-blob --yes --new-bundle-format=false --output-signature "${f}.sig" --output-certificate "${f}.pem" "$f"
          done

      - name: Upload release archive
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            deps-lsp-${{ matrix.target }}.*
            deps-cli-${{ matrix.target }}.*

  generate-sbom:
    name: Generate SBOM
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM for release binaries
        # `--describe binaries`: model the released deps-lsp/deps-cli binaries as actually
        # built by build-binaries (default features), not every workspace crate. Output
        # filename is `<crate>_bin.cdx.json` (cargo-cyclonedx 0.5.9's fixed naming for a
        # `[[bin]]` target under --describe binaries), verified locally before relying on it.
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries --manifest-path crates/deps-lsp/Cargo.toml
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries --manifest-path crates/deps-cli/Cargo.toml
          mv crates/deps-lsp/deps-lsp_bin.cdx.json deps-lsp.cdx.json
          mv crates/deps-cli/deps-cli_bin.cdx.json deps-cli.cdx.json
          shasum -a 256 deps-lsp.cdx.json > deps-lsp.cdx.json.sha256
          shasum -a 256 deps-cli.cdx.json > deps-cli.cdx.json.sha256

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            deps-lsp.cdx.json*
            deps-cli.cdx.json*

  scan-github-action-image:
    name: Scan GitHub Action Image
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image locally for scanning
        # Single-platform (no QEMU/setup-qemu-action needed here, unlike the real multi-arch
        # publish build below): `docker/build-push-action`'s `load: true` only supports loading
        # one platform's image into the local daemon, and this build exists purely to hand
        # Trivy a concrete image to scan, not to publish. Fetches the deps-cli
        # x86_64-unknown-linux-musl binary build-binaries just uploaded to this release (needs:
        # build-binaries above), same as the real publish build.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: crates/github-action
          platforms: linux/amd64
          load: true
          push: false
          tags: deps-lsp-github-action:local
          build-args: |
            DEPS_CLI_VERSION=v${{ needs.create-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # continue-on-error: trivy exits 1 when vulnerabilities are found; without this the
        # upload step below would be skipped and findings lost from the Security tab. The
        # explicit "Fail on vulnerabilities found" step further down still blocks
        # `build-github-action-image` (via `needs`) from publishing on a CRITICAL/HIGH finding
        # — unlike ci.yml's PR-time scan, a real image is about to be pushed to GHCR here, so
        # this repo's own supply-chain hygiene bar (already applied to its own dependencies via
        # the #1122 deps-lsp-check gate) applies to the image it publishes too.
        continue-on-error: true
        with:
          image-ref: deps-lsp-github-action:local
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on vulnerabilities found
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy found CRITICAL/HIGH vulnerabilities in the image — see the Security tab for details. Publishing is blocked until resolved."
          exit 1

  build-github-action-image:
    name: Build and Publish GitHub Action Image
    needs: [create-release, build-binaries, scan-github-action-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tags
        id: tags
        run: |
          version="${{ needs.create-release.outputs.version }}"
          major="${version%%.*}"
          minor="${version%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # Fetches the deps-cli x86_64/aarch64-unknown-linux-musl binaries that
        # build-binaries just uploaded to this release (needs: build-binaries above) from the
        # GitHub release download URL and verifies them by checksum (crates/github-action/
        # Dockerfile) — it does not invoke `cargo build` a second time. Gated behind
        # scan-github-action-image (needs above): a CRITICAL/HIGH Trivy finding there fails
        # this job before it ever runs, so a vulnerable image is never pushed to GHCR.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: crates/github-action
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEPS_CLI_VERSION=v${{ steps.tags.outputs.version }}
          tags: |
            ghcr.io/bug-ops/deps-lsp-github-action:${{ steps.tags.outputs.version }}
            ghcr.io/bug-ops/deps-lsp-github-action:${{ steps.tags.outputs.minor }}
            ghcr.io/bug-ops/deps-lsp-github-action:${{ steps.tags.outputs.major }}
            ghcr.io/bug-ops/deps-lsp-github-action:latest

  build-wasm:
    name: Build WASM (Zed Extension)
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          targets: wasm32-wasip1
          cache-target: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Zed extension
        working-directory: crates/deps-zed
        run: cargo build --target wasm32-wasip1 --release

      - name: Create WASM archive
        run: |
          cd crates/deps-zed/target/wasm32-wasip1/release
          tar czf ../../../../../deps-zed.wasm.tar.gz deps_zed.wasm
          cd ../../../../..
          shasum -a 256 deps-zed.wasm.tar.gz > deps-zed.wasm.tar.gz.sha256

      - name: Upload WASM archive
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            deps-zed.wasm.*

  publish-crates:
    name: Publish to crates.io
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1

      - name: Publish crates to crates.io
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b  # v2
        with:
          registry-token: ${{ steps.crates-io-auth.outputs.token }}
          ignore-unpublished-changes: true
          publish-delay: 10000

  update-release-notes:
    name: Update Release Notes
    needs: [create-release, build-binaries, build-wasm, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update release with installation instructions
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          append_body: true
          body: |

            ## Installation

            ### deps-lsp

            #### Binary Installation

            Download the appropriate binary for your platform from the assets below:

            - **Linux x86_64 (glibc)**: `deps-lsp-x86_64-unknown-linux-gnu.tar.gz`
            - **Linux aarch64 (glibc)**: `deps-lsp-aarch64-unknown-linux-gnu.tar.gz`
            - **Linux x86_64 (musl)**: `deps-lsp-x86_64-unknown-linux-musl.tar.gz`
            - **Linux aarch64 (musl)**: `deps-lsp-aarch64-unknown-linux-musl.tar.gz`
            - **macOS x86_64**: `deps-lsp-x86_64-apple-darwin.tar.gz`
            - **macOS ARM64**: `deps-lsp-aarch64-apple-darwin.tar.gz`
            - **Windows x64**: `deps-lsp-x86_64-pc-windows-msvc.zip`
            - **Windows ARM64**: `deps-lsp-aarch64-pc-windows-msvc.zip`

            Extract and add to your PATH:

            ```bash
            # Linux/macOS
            tar xzf deps-lsp-*.tar.gz
            sudo mv deps-lsp /usr/local/bin/

            # Verify installation
            deps-lsp --version
            ```

            #### Cargo Installation

            ```bash
            cargo install deps-lsp
            ```

            #### Zed Extension

            The Zed extension will automatically download the appropriate binary from this release.

            ### deps-cli

            #### Install Script

            ```bash
            curl -fsSL https://raw.githubusercontent.com/bug-ops/deps-lsp/main/scripts/install-deps-cli.sh | sh
            ```

            The script detects your OS/architecture, downloads the matching release asset below,
            verifies its SHA256 checksum, and installs `deps-cli` to `${CARGO_HOME:-~/.cargo}/bin`
            (falling back to `~/.local/bin`). Set `DEPS_CLI_VERSION` to install a specific tag, or
            `DEPS_CLI_INSTALL_DIR` to override the install directory. Windows is not supported by the
            script — download the `.zip` asset below instead.

            #### Binary Installation

            Download the appropriate binary for your platform from the assets below:

            - **Linux x86_64 (glibc)**: `deps-cli-x86_64-unknown-linux-gnu.tar.gz`
            - **Linux aarch64 (glibc)**: `deps-cli-aarch64-unknown-linux-gnu.tar.gz`
            - **Linux x86_64 (musl)**: `deps-cli-x86_64-unknown-linux-musl.tar.gz`
            - **Linux aarch64 (musl)**: `deps-cli-aarch64-unknown-linux-musl.tar.gz`
            - **macOS x86_64**: `deps-cli-x86_64-apple-darwin.tar.gz`
            - **macOS ARM64**: `deps-cli-aarch64-apple-darwin.tar.gz`
            - **Windows x64**: `deps-cli-x86_64-pc-windows-msvc.zip`
            - **Windows ARM64**: `deps-cli-aarch64-pc-windows-msvc.zip`

            ```bash
            # Linux/macOS
            tar xzf deps-cli-*.tar.gz
            sudo mv deps-cli /usr/local/bin/

            # Verify installation
            deps-cli --version
            ```

            #### Cargo Installation

            ```bash
            cargo install deps-cli
            ```

            ## Checksums

            SHA256 checksums are available for all artifacts (`.sha256` files).
