# Codecov configuration
# Documentation: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    # Overall project coverage
    project:
      default:
        target: 70%        # Minimum coverage target
        threshold: 2%      # Allow 2% drop without failing
        informational: false

    # Coverage for new code in PR
    patch:
      default:
        target: 80%        # New code should be well-tested
        threshold: 1%
        informational: false

  # Precision of coverage percentage
  precision: 2
  round: down

  # Range of coverage percentage colors
  range: 60..90

# Comment on PRs with coverage details
comment:
  layout: "reach,diff,components,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignore these paths from coverage
ignore:
  - "tests/"
  - "benches/"
  - "examples/"
  - "**/main.rs"
  - "crates/deps-zed/**/*"  # WASM extension has limited testing

# Per-crate components for detailed coverage tracking.
# Unlike `flags`, components are derived from the single workspace lcov.info
# upload via path globs below — no per-crate CI upload required. See each
# crate README's codecov badge (?component=<component_id>).
component_management:
  individual_components:
    - component_id: deps-bundler
      name: deps-bundler
      paths:
        - crates/deps-bundler/**
    - component_id: deps-cargo
      name: deps-cargo
      paths:
        - crates/deps-cargo/**
    - component_id: deps-cli
      name: deps-cli
      paths:
        - crates/deps-cli/**
    - component_id: deps-composer
      name: deps-composer
      paths:
        - crates/deps-composer/**
    - component_id: deps-core
      name: deps-core
      paths:
        - crates/deps-core/**
    - component_id: deps-dart
      name: deps-dart
      paths:
        - crates/deps-dart/**
    - component_id: deps-deno
      name: deps-deno
      paths:
        - crates/deps-deno/**
    - component_id: deps-engine
      name: deps-engine
      paths:
        - crates/deps-engine/**
    - component_id: deps-github-actions
      name: deps-github-actions
      paths:
        - crates/deps-github-actions/**
    - component_id: deps-gitlab-ci
      name: deps-gitlab-ci
      paths:
        - crates/deps-gitlab-ci/**
    - component_id: deps-go
      name: deps-go
      paths:
        - crates/deps-go/**
    - component_id: deps-gradle
      name: deps-gradle
      paths:
        - crates/deps-gradle/**
    - component_id: deps-lsp
      name: deps-lsp
      paths:
        - crates/deps-lsp/**
    - component_id: deps-maven
      name: deps-maven
      paths:
        - crates/deps-maven/**
    - component_id: deps-npm
      name: deps-npm
      paths:
        - crates/deps-npm/**
    - component_id: deps-nuget
      name: deps-nuget
      paths:
        - crates/deps-nuget/**
    - component_id: deps-pypi
      name: deps-pypi
      paths:
        - crates/deps-pypi/**
    - component_id: deps-swift
      name: deps-swift
      paths:
        - crates/deps-swift/**

# Codecov will wait this long for coverage reports
codecov:
  max_report_age: off
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
