# Backstops the DashMap Ref-across-await hazard (#333) at the lint level: holding any
# of these guard types across an `.await` point blocks concurrent access to the same
# shard for the duration of the await. Activates the already-enabled
# `clippy::await_holding_invalid_type` lint (see `[workspace.lints.clippy]` in the
# root `Cargo.toml`) for these types project-wide.
# Restriction lints added for #673 (indexing_slicing/unwrap_used/expect_used) guard
# the request path; idiomatic `.unwrap()`/`[idx]` in test code is not part of that
# threat model, so exempt test functions/modules and `tests/` integration binaries.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true

# 100 would need about 40 files of `#[expect]`; see #1920
too-many-lines-threshold = 150

# `as_any` survives only on the registry-side traits and is used by tests alone (#1970);
# test modules opt out via `#![cfg_attr(test, allow(clippy::disallowed_methods))]` in the
# crate root, and CI pins the list of crates that carry it.
disallowed-methods = [
    { path = "deps_core::registry::Registry::as_any", reason = "downcasting is test-only; use a typed API" },
    { path = "deps_core::registry::Version::as_any", reason = "downcasting is test-only; use a typed API" },
    { path = "deps_core::registry::Metadata::as_any", reason = "downcasting is test-only; use a typed API" },
]

await-holding-invalid-types = [
    { path = "dashmap::mapref::one::Ref", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::mapref::one::RefMut", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::mapref::one::MappedRef", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::mapref::one::MappedRefMut", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::mapref::multiple::RefMulti", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::mapref::multiple::RefMutMulti", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::mapref::entry::Entry", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::mapref::entry::VacantEntry", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::mapref::entry::OccupiedEntry", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::iter::Iter", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
    { path = "dashmap::iter::IterMut", reason = "holds a DashMap shard lock; release it before awaiting (see `ServerState::with_document`)" },
]
