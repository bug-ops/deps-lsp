[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false

# `redacting_debug_compile_fail` (crates/deps-core/tests/, issue #1238) forks a real `rustc`
# per trybuild fixture (6 as of this writing) to compile-fail-test the RedactingDebug derive.
# That's inherently slower than a normal test and pushed past the workspace's default 120s
# slow-timeout under the extra overhead of cross-compilation (i686-unknown-linux-gnu) and
# coverage instrumentation (llvm-cov), even though it finishes well within the default window
# on a normal native build. Give it more headroom instead of raising the timeout workspace-wide.
[[profile.default.overrides]]
filter = 'test(redacting_debug_compile_fail)'
slow-timeout = { period = "60s", terminate-after = 8 }

# #2169: nextest intermittently reports LEAK (pipes still open ~100 ms after the test process
# exits) for these two in-process mockito tests under full-suite load. No holder was found: the
# tests spawn no child process (only the deps-lsp mkfifo test helpers and deps-npm's catalog_usage
# test use `Command`, neither reachable from them), 48 isolated/loaded stress runs showed no LEAK,
# and the only unjoined task is a drain task inside the test process. Widen the window for these two
# tests only; remove the override if a holder is ever identified.
[[profile.default.overrides]]
filter = 'test(rt_002_npm_edit_during_initial_fetch_keeps_registry_data) | test(adding_uv_toml_applies_the_window_to_an_open_document)'
leak-timeout = "1s"

[profile.ci]
retries = 2
fail-fast = true

[profile.coverage]
retries = 0
fail-fast = false
