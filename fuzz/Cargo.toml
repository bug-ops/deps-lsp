[package]
name = "deps-lsp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Deliberately its own workspace (cargo-fuzz's standard layout): keeps this crate's
# dependency resolution independent of the root workspace, and avoids inheriting
# `unsafe_code = "forbid"`/`[workspace.lints]` from `../Cargo.toml`, which cargo-fuzz's
# generated libFuzzer harness plumbing is not written to satisfy (see #673 and
# `.claude/rules/branching.md` on `crates/deps-zed`'s equivalent exclusion pattern).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tower-lsp-server = "0.23"

[dependencies.deps-core]
path = "../crates/deps-core"

[dependencies.deps-bundler]
path = "../crates/deps-bundler"

[dependencies.deps-go]
path = "../crates/deps-go"

[dependencies.deps-swift]
path = "../crates/deps-swift"

[dependencies.deps-gradle]
path = "../crates/deps-gradle"
features = ["fuzzing"]

[dependencies.deps-maven]
path = "../crates/deps-maven"
features = ["fuzzing"]

[dependencies.deps-nuget]
path = "../crates/deps-nuget"

[dependencies.deps-pypi]
path = "../crates/deps-pypi"

[dependencies.deps-github-actions]
path = "../crates/deps-github-actions"

[dependencies.deps-gitlab-ci]
path = "../crates/deps-gitlab-ci"

[dependencies.deps-dart]
path = "../crates/deps-dart"

[dependencies.deps-npm]
path = "../crates/deps-npm"
features = ["fuzzing"]

[profile.release]
debug = 1

[[bin]]
name = "parser_checks"
path = "fuzz_targets/parser_checks.rs"
test = false
doc = false
bench = false

